services:
  flight-db:
    image: postgres:17
    environment:
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
      POSTGRES_DB: flights
    ports:
      - "5433:5432"
    volumes:
      - flight-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "flight", "-d", "flights"]
      interval: 5s
      timeout: 3s
      retries: 10

  flight-migrate:
    image: flyway/flyway:11
    depends_on:
      flight-db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://flight-db:5432/flights
      FLYWAY_USER: flight
      FLYWAY_PASSWORD: flight
    volumes:
      - ./flight-service/migrations:/flyway/sql
    command: migrate

  redis-master:
    image: redis:7.4
    command: ["redis-server", "--replica-announce-ip", "redis-master"]
    healthcheck: &redis-healthcheck
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica:
    image: redis:7.4
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--replica-announce-ip", "redis-replica"]
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck: *redis-healthcheck

  redis-sentinel-1: &redis-sentinel
    image: redis:7.4
    command: ["sh", "/sentinel.sh"]
    volumes:
      - ./redis/sentinel.sh:/sentinel.sh:ro
    environment:
      SENTINEL_ANNOUNCE_HOST: redis-sentinel-1
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-sentinel-2:
    <<: *redis-sentinel
    environment:
      SENTINEL_ANNOUNCE_HOST: redis-sentinel-2

  redis-sentinel-3:
    <<: *redis-sentinel
    environment:
      SENTINEL_ANNOUNCE_HOST: redis-sentinel-3

  flight-service:
    build:
      context: .
      dockerfile: flight-service/Dockerfile
    depends_on:
      flight-migrate:
        condition: service_completed_successfully
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://flight:flight@flight-db:5432/flights
      GRPC_PORT: "50051"
      FLIGHT_API_KEY: ${FLIGHT_API_KEY:-dev-secret-key}
      REDIS_ADDRS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      CACHE_TTL: 5m
    ports:
      - "50051:50051"

  booking-db:
    image: postgres:17
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: bookings
    ports:
      - "5434:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "booking", "-d", "bookings"]
      interval: 5s
      timeout: 3s
      retries: 10

  booking-migrate:
    image: flyway/flyway:11
    depends_on:
      booking-db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://booking-db:5432/bookings
      FLYWAY_USER: booking
      FLYWAY_PASSWORD: booking
    volumes:
      - ./booking-service/migrations:/flyway/sql
    command: migrate

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
      flight-service:
        condition: service_started
    environment:
      DATABASE_URL: postgres://booking:booking@booking-db:5432/bookings
      FLIGHT_SERVICE_ADDR: flight-service:50051
      FLIGHT_API_KEY: ${FLIGHT_API_KEY:-dev-secret-key}
      FLIGHT_SERVICE_TIMEOUT: 5s
      RETRY_MAX_ATTEMPTS: "3"
      RETRY_INITIAL_BACKOFF: 100ms
      RETRY_ATTEMPT_TIMEOUT: 1s
      CB_FAILURE_THRESHOLD: "5"
      CB_WINDOW: 30s
      CB_OPEN_TIMEOUT: 15s
      HTTP_PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  flight-db-data:
  booking-db-data:
