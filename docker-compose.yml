services:
  postgres:                                  
    image: postgres:17                    
    environment:                          
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 6767     
      POSTGRES_DB: marketplace       
    ports:
      - "5432:5432"                     
    volumes:
      - pgdata:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "marketplace"]
      interval: 5s
      timeout: 3s
      retries: 10

  flyway:
    image: flyway/flyway:11
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/marketplace
      FLYWAY_USER: admin
      FLYWAY_PASSWORD: 6767
    volumes:
      - ./migrations:/flyway/sql
    command: migrate

volumes:
  pgdata:                          