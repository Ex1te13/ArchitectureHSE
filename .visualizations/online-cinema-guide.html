<script type="application/json" id="cinema-sources">{"docker-compose.yml": "services:\n  kafka:\n    image: confluentinc/cp-kafka:7.9.11\n    hostname: kafka\n    ports:\n      - \"127.0.0.1:9092:9092\"\n    environment:\n      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk\n      KAFKA_NODE_ID: 1\n      KAFKA_PROCESS_ROLES: broker,controller\n      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093\n      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER\n      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL\n      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT\n      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:29093\n      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092\n      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1\n      KAFKA_AUTO_CREATE_TOPICS_ENABLE: \"false\"\n      KAFKA_LOG_DIRS: /var/lib/kafka/data\n    volumes:\n      - kafka-data:/var/lib/kafka/data\n    healthcheck:\n      test: [\"CMD\", \"kafka-topics\", \"--bootstrap-server\", \"kafka:29092\", \"--list\"]\n      interval: 10s\n      timeout: 8s\n      retries: 12\n      start_period: 20s\n\n  schema-registry:\n    image: confluentinc/cp-schema-registry:7.9.11\n    ports:\n      - \"127.0.0.1:8081:8081\"\n    depends_on:\n      kafka:\n        condition: service_healthy\n    environment:\n      SCHEMA_REGISTRY_HOST_NAME: schema-registry\n      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081\n      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092\n      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"--fail\", \"--silent\", \"http://localhost:8081/subjects\"]\n      interval: 5s\n      timeout: 3s\n      retries: 12\n      start_period: 20s\n\n  kafka-init:\n    image: confluentinc/cp-kafka:7.9.11\n    depends_on:\n      kafka:\n        condition: service_healthy\n    entrypoint: [\"kafka-topics\"]\n    command:\n      - --bootstrap-server\n      - kafka:29092\n      - --create\n      - --if-not-exists\n      - --topic\n      - movie-events\n      - --partitions\n      - \"3\"\n      - --replication-factor\n      - \"1\"\n\n  schema-init:\n    build:\n      context: .\n      target: schema-init\n    depends_on:\n      kafka-init:\n        condition: service_completed_successfully\n      schema-registry:\n        condition: service_healthy\n    environment:\n      SCHEMA_REGISTRY_URL: http://schema-registry:8081\n\n  producer:\n    build:\n      context: .\n      target: producer\n    ports:\n      - \"127.0.0.1:8080:8080\"\n    depends_on:\n      schema-init:\n        condition: service_completed_successfully\n    environment:\n      KAFKA_BROKERS: kafka:29092\n      SCHEMA_REGISTRY_URL: http://schema-registry:8081\n      GENERATE_EVENTS: ${GENERATE_EVENTS:-false}\n      GENERATOR_INTERVAL: ${GENERATOR_INTERVAL:-5s}\n\n  clickhouse:\n    image: clickhouse/clickhouse-server:26.8.45.6\n    ports:\n      - \"127.0.0.1:8123:8123\"\n    environment:\n      CLICKHOUSE_USER: cinema\n      CLICKHOUSE_PASSWORD: cinema\n    volumes:\n      - clickhouse-data:/var/lib/clickhouse\n    healthcheck:\n      test: [\"CMD\", \"clickhouse-client\", \"--user\", \"cinema\", \"--password\", \"cinema\", \"--query\", \"SELECT 1\"]\n      interval: 5s\n      timeout: 3s\n      retries: 12\n      start_period: 10s\n\n  clickhouse-init:\n    image: clickhouse/clickhouse-server:26.8.45.6\n    depends_on:\n      clickhouse:\n        condition: service_healthy\n    volumes:\n      - ./clickhouse:/migrations:ro\n    entrypoint: [\"clickhouse-client\"]\n    command: [\"--host\", \"clickhouse\", \"--user\", \"cinema\", \"--password\", \"cinema\", \"--queries-file\", \"/migrations/001_movie_events.sql\", \"/migrations/002_daily_metrics.sql\"]\n\n  postgres:\n    image: postgres:17\n    environment:\n      POSTGRES_DB: cinema\n      POSTGRES_USER: cinema\n      POSTGRES_PASSWORD: cinema\n    volumes:\n      - postgres-data:/var/lib/postgresql/data\n      - ./postgres:/docker-entrypoint-initdb.d:ro\n    healthcheck:\n      test: [\"CMD\", \"pg_isready\", \"-h\", \"127.0.0.1\", \"-U\", \"cinema\", \"-d\", \"cinema\"]\n      interval: 5s\n      timeout: 3s\n      retries: 12\n\n  aggregation:\n    build:\n      context: .\n      target: aggregation\n    ports:\n      - \"127.0.0.1:8082:8082\"\n    depends_on:\n      postgres:\n        condition: service_healthy\n      clickhouse-init:\n        condition: service_completed_successfully\n    environment:\n      DATABASE_URL: postgres://cinema:cinema@postgres:5432/cinema?sslmode=disable\n      CLICKHOUSE_URL: http://clickhouse:8123\n      CLICKHOUSE_USER: cinema\n      CLICKHOUSE_PASSWORD: cinema\n      AGGREGATION_INTERVAL: ${AGGREGATION_INTERVAL:-5m}\n\n  pipeline-test:\n    profiles: [\"test\"]\n    build:\n      context: .\n      target: pipeline-test\n    depends_on:\n      producer:\n        condition: service_started\n      clickhouse-init:\n        condition: service_completed_successfully\n    environment:\n      PRODUCER_URL: http://producer:8080\n      CLICKHOUSE_URL: http://clickhouse:8123\n      CLICKHOUSE_USER: cinema\n      CLICKHOUSE_PASSWORD: cinema\n\nvolumes:\n  kafka-data:\n  clickhouse-data:\n  postgres-data:\n", "postgres/001_daily_metrics.sql": "CREATE TABLE IF NOT EXISTS daily_metrics (\n    day date NOT NULL,\n    metric text NOT NULL,\n    movie_id text NOT NULL DEFAULT '',\n    value double precision,\n    computed_at timestamptz NOT NULL,\n    PRIMARY KEY (day, metric, movie_id)\n);\n", "README.md": "# Online Cinema\n\n## 1. Kafka и схема событий\n\nВ этой папке команда `docker compose up -d` поднимает Kafka в режиме KRaft и Schema Registry. После запуска `kafka-init` создаёт топик `movie-events` с тремя партициями, а программа на Go из [`cmd/schema-init`](cmd/schema-init/) регистрирует [Avro-схему](schemas/movie-event.avsc) под именем `movie-events-value`. При первой регистрации версия схемы равна `1`. Повторный запуск с той же схемой сохраняет её версию.\n\nПосле изменений в программе или схеме образ можно пересобрать командой `docker compose up -d --build`.\n\n**Ключ сообщения — `user_id`.** Ключ задаётся продюсером отдельно от значения сообщения. При фиксированном числе партиций и одинаковом алгоритме партиционирования все события пользователя попадают в одну партицию. Так последовательность просмотра читается в порядке записи, даже если пользователь переключается между фильмами. Ключ по фильму мог бы сосредоточить события популярной премьеры в одной партиции.\n\n| Компонент | Из Docker Compose | С хоста |\n|---|---|---|\n| Kafka | `kafka:29092` | `localhost:9092` |\n| Schema Registry | `http://schema-registry:8081` | `http://localhost:8081` |\n\n### Проверка\n\n```sh\ndocker compose wait schema-init\ndocker compose logs schema-init\ndocker compose exec kafka kafka-topics --bootstrap-server kafka:29092 --describe --topic movie-events\ncurl -fsS http://localhost:8081/subjects/movie-events-value/versions/1\n```\n\nОжидаются запись об успешной регистрации, `PartitionCount: 3` в описании топика и `\"version\":1` в ответе Schema Registry. Состояние Kafka и версии схем хранятся в томе `kafka-data`.\n\n## 2. Продюсер\n\n`docker compose up -d --build` запускает HTTP API на `localhost:8080`. Продюсер берёт версию `1` схемы из Schema Registry, проверяет событие и отправляет его в `movie-events` в формате Confluent Avro. Kafka-клиент ждёт `acks=all` и повторяет временные ошибки с задержкой от 250 мс до 4 с. Успешную запись продюсер логирует с `event_id`, `event_type` и `timestamp`.\n\n```sh\ncurl -i http://localhost:8080/events \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"user_id\": \"user-42\",\n    \"movie_id\": \"movie-17\",\n    \"event_type\": \"VIEW_STARTED\",\n    \"timestamp\": \"2026-11-24T15:04:05Z\",\n    \"device_type\": \"TV\",\n    \"session_id\": \"session-9\",\n    \"progress_seconds\": 0\n  }'\n```\n\nУспешная запись возвращает `201` и `event_id`. Можно передать свой UUID или получить сгенерированный. Некорректное событие возвращает `400`, ошибка публикации — `503`. Время передаётся в формате RFC 3339. У событий просмотра прогресс целый и неотрицательный, у лайка и поиска — `null`. Поиск без привязки к фильму использует пустой `movie_id`.\n\n### Генератор\n\n```sh\nGENERATE_EVENTS=true GENERATOR_INTERVAL=2s docker compose up -d --build\ndocker compose logs -f producer\n```\n\nГенератор отправляет сессии с поиском, началом просмотра и паузой. Часть пользователей прекращает просмотр на паузе, остальные продолжают и досматривают фильм. После завершения часть пользователей ставит лайк. События одной сессии идут в порядке действий и используют один `session_id`. Прогресс растёт по мере просмотра, на паузе сохраняется. По умолчанию генератор выключен, интервал между сессиями — 5 секунд.\n\n## 3. Приём событий в ClickHouse\n\nПри запуске Compose сервис `clickhouse-init` автоматически применяет [SQL-миграцию](clickhouse/001_movie_events.sql). `cinema.movie_events_kafka` читает топик `movie-events` в формате `AvroConfluent`. Materialized View `cinema.movie_events_ingest` переносит записи в `cinema.movie_events`, где они сохраняются в таблице `MergeTree`.\n\nВ таблице хранятся UUID, время в UTC с точностью до миллисекунд, перечисления типов событий и устройств, а также `Nullable(Int32)` для прогресса. Данные разбиты на месячные партиции. Сортировка начинается с дня и типа события для запросов за день, а `user_id` и точное время помогают читать события пользователя внутри этого диапазона.\n\nПосмотреть последние записи можно через HTTP-интерфейс ClickHouse на `localhost:8123`:\n\n```sh\ncurl -fsS -u cinema:cinema http://localhost:8123/ \\\n  --data-binary 'SELECT * FROM cinema.movie_events ORDER BY timestamp DESC LIMIT 10'\n```\n\n## 4. Интеграционный тест\n\nИз этой папки запусти:\n\n```sh\ndocker compose run --rm --build pipeline-test\n```\n\nCompose поднимает зависимости и применяет миграцию. [Go-тест](integration/pipeline_test.go) отправляет через HTTP событие просмотра с прогрессом и поиск с `null` в поле прогресса. Он ждёт записи в `cinema.movie_events` и сравнивает все восемь полей, включая миллисекунды. Каждый запуск использует новые UUID и проверяет только свои строки, поэтому тест можно запускать повторно на том же стеке.\n\n## 5. Сервис агрегации\n\n`docker compose up -d --build` запускает отдельный Go-сервис `aggregation`. При старте и затем раз в 5 минут он пересчитывает вчера и сегодня по UTC. Это позволяет учесть события, которые пришли уже после полуночи. Интервал задаётся через `AGGREGATION_INTERVAL`, например `30s`. За другую дату пересчёт можно вызвать вручную:\n\n```sh\ncurl -fsS -X POST 'http://localhost:8082/recalculate?date=2026-11-24'\ndocker compose logs aggregation\n```\n\n[SQL-запрос](internal/aggregation/daily.sql) читает события из `cinema.movie_events`. Дневные показатели используют уникальные записи событий. День в таблицах — дата активности по UTC.\n\n| Метрика | Расчёт за день |\n|---|---|\n| `dau` | Число уникальных пользователей с любым событием |\n| `avg_watch_seconds` | Среднее значение прогресса у `VIEW_FINISHED`, в секундах |\n| `movie_views` | Топ-10 фильмов по числу `VIEW_STARTED`. При равенстве выбираем по `movie_id` |\n| `conversion` | Число `VIEW_FINISHED`, делённое на число `VIEW_STARTED` |\n| `retention_d1`, `retention_d7` | Доля пользователей с первым `VIEW_STARTED` ровно 1 или 7 дней назад, у которых в день отчёта было любое событие |\n| `events_processed` | Количество обработанных событий за день |\n\nНапример, D1 за 10 января отвечает на вопрос «какая доля пользователей, впервые начавших просмотр 9 января, вернулась 10-го?». Доли хранятся от единицы: `0.5` означает 50%. Пустая когорта, отсутствие стартов для конверсии и отсутствие завершений для среднего дают `NULL`. В день без активности DAU равен нулю.\n\nСервис собирает результат в промежуточной таблице ClickHouse и заменяет дневную партицию в `cinema.daily_metrics`. Затем он сохраняет тот же набор строк и время вычисления в PostgreSQL. Там замена всех строк дня выполняется одной транзакцией. Так при пересчёте обновляются значения и исчезают фильмы, выпавшие из топа. Пересчёты одной даты выполняются по очереди. При ошибке сервис пишет причину в лог и делает до трёх попыток. Если PostgreSQL временно недоступен после обновления ClickHouse, повторный пересчёт той же даты синхронизирует обе базы.\n\nПосмотреть результаты и проверить сервис можно из папки проекта:\n\n```sh\ndocker compose exec postgres psql -U cinema -d cinema -c \"SELECT * FROM daily_metrics ORDER BY day DESC, metric, value DESC\"\nsh integration/aggregation_test.sh\n```\n\nТест использует отдельные пустые базы, создаёт события с известными значениями и дважды пересчитывает одну дату. После каждого запуска он сравнивает все показатели в обеих базах с ожидаемыми.\n", "schemas/movie-event.avsc": "{\n  \"type\": \"record\",\n  \"name\": \"MovieEvent\",\n  \"namespace\": \"cinema.events\",\n  \"fields\": [\n    {\n      \"name\": \"event_id\",\n      \"type\": {\"type\": \"string\", \"logicalType\": \"uuid\"}\n    },\n    {\"name\": \"user_id\", \"type\": \"string\"},\n    {\n      \"name\": \"movie_id\",\n      \"type\": \"string\",\n      \"doc\": \"Empty for a search without a specific movie\"\n    },\n    {\n      \"name\": \"event_type\",\n      \"type\": {\n        \"type\": \"enum\",\n        \"name\": \"EventType\",\n        \"symbols\": [\"VIEW_STARTED\", \"VIEW_FINISHED\", \"VIEW_PAUSED\", \"VIEW_RESUMED\", \"LIKED\", \"SEARCHED\"]\n      }\n    },\n    {\n      \"name\": \"timestamp\",\n      \"type\": {\"type\": \"long\", \"logicalType\": \"timestamp-millis\"}\n    },\n    {\n      \"name\": \"device_type\",\n      \"type\": {\n        \"type\": \"enum\",\n        \"name\": \"DeviceType\",\n        \"symbols\": [\"MOBILE\", \"DESKTOP\", \"TV\", \"TABLET\"]\n      }\n    },\n    {\"name\": \"session_id\", \"type\": \"string\"},\n    {\n      \"name\": \"progress_seconds\",\n      \"type\": [\"null\", \"int\"],\n      \"default\": null,\n      \"doc\": \"Non-negative playback position for VIEW_* events. Null for LIKED and SEARCHED\"\n    }\n  ]\n}\n", "go.sum": "github.com/davecgh/go-spew v1.1.0/go.mod h1:J7Y8YcW2NihsgmVo/mv3lAwl/skON4iLHjSsI+c5H38=\ngithub.com/davecgh/go-spew v1.1.1 h1:vj9j/u1bqnvCEfJOwUhtlOARqs3+rkHYY13jYWTU97c=\ngithub.com/davecgh/go-spew v1.1.1/go.mod h1:J7Y8YcW2NihsgmVo/mv3lAwl/skON4iLHjSsI+c5H38=\ngithub.com/golang/snappy v0.0.1 h1:Qgr9rKW7uDUkrbSmQeiDsGa8SjGyCOGtuasMWwvp2P4=\ngithub.com/golang/snappy v0.0.1/go.mod h1:/XxbfmMg8lxefKM7IXC3fBNl/7bRcc72aCRzEWrmP2Q=\ngithub.com/google/uuid v1.6.0 h1:NIvaJDMOsjHA8n1jAhLSgzrAzy1Hgr+hNrb57e+94F0=\ngithub.com/google/uuid v1.6.0/go.mod h1:TIyPZe4MgqvfeYDBFedMoGGpEw/LqOeaOT+nhxU+yHo=\ngithub.com/jackc/pgpassfile v1.0.0 h1:/6Hmqy13Ss2zCq62VdNG8tM1wchn8zjSGOBJ6icpsIM=\ngithub.com/jackc/pgpassfile v1.0.0/go.mod h1:CEx0iS5ambNFdcRtxPj5JhEz+xB6uRky5eyVu/W2HEg=\ngithub.com/jackc/pgservicefile v0.0.0-20240606120523-5a60cdf6a761 h1:iCEnooe7UlwOQYpKFhBabPMi4aNAfoODPEFNiAnClxo=\ngithub.com/jackc/pgservicefile v0.0.0-20240606120523-5a60cdf6a761/go.mod h1:5TJZWKEWniPve33vlWYSoGYefn3gLQRzjfDlhSJ9ZKM=\ngithub.com/jackc/pgx/v5 v5.12.0 h1:hWwax8YiGT0YiN50U1oIDn5kgR7KC2tG3rmavwpPkxY=\ngithub.com/jackc/pgx/v5 v5.12.0/go.mod h1:u2Fi6no03HCSBYE+ZVdLxbwdu3xyi2vU+K/YNJioSds=\ngithub.com/jackc/puddle/v2 v2.2.3 h1:f8HoREISb3l5eO9coPgK7U3hKLhWGokOFVcThl5jrao=\ngithub.com/jackc/puddle/v2 v2.2.3/go.mod h1:vriiEXHvEE654aYKXXjOvZM39qJ0q+azkZFrfEOc3H4=\ngithub.com/klauspost/compress v1.20.3 h1:zWNoFqq/lSuYQRim3dUXlXeA0IqwuZGicdG5ZTfY5j4=\ngithub.com/klauspost/compress v1.20.3/go.mod h1:LUdAzn7YLVvxLpc7y3V1m40wESHTgc1422pwwBSKYuI=\ngithub.com/linkedin/goavro/v2 v2.15.0 h1:pDj1UrjUOO62iXhgBiE7jQkpNIc5/tA5eZsgolMjgVI=\ngithub.com/linkedin/goavro/v2 v2.15.0/go.mod h1:KXx+erlq+RPlGSPmLF7xGo6SAbh8sCQ53x064+ioxhk=\ngithub.com/pierrec/lz4/v4 v4.1.33 h1:GjG1TJ1V4IzKP8L96muuuDNpTwd7D+l2ccXrjAbe014=\ngithub.com/pierrec/lz4/v4 v4.1.33/go.mod h1:7SE9MC2STkNtL4PIwGhjmyVwvILaGI9/COYQNBhKM/c=\ngithub.com/pmezard/go-difflib v1.0.0 h1:4DBwDE0NGyQoBHbLQYPwSUPoCMWR5BEzIk/f1lZbAQM=\ngithub.com/pmezard/go-difflib v1.0.0/go.mod h1:iKH77koFhYxTK1pcRnkKkqfTogsbg7gZNVY4sRDYZ/4=\ngithub.com/stretchr/objx v0.1.0/go.mod h1:HFkY916IF+rwdDfMAkV7OtwuqBVzrE8GR6GFx+wExME=\ngithub.com/stretchr/objx v0.4.0/go.mod h1:YvHI0jy2hoMjB+UWwv71VJQ9isScKT/TqJzVSSt89Yw=\ngithub.com/stretchr/testify v1.3.0/go.mod h1:M5WIy9Dh21IEIfnGCwXGc5bZfKNJtfHm1UVUgZn+9EI=\ngithub.com/stretchr/testify v1.7.0/go.mod h1:6Fq8oRcR53rry900zMqJjRRixrwX3KX962/h/Wwjteg=\ngithub.com/stretchr/testify v1.7.1/go.mod h1:6Fq8oRcR53rry900zMqJjRRixrwX3KX962/h/Wwjteg=\ngithub.com/stretchr/testify v1.7.5/go.mod h1:yNjHg4UonilssWZ8iaSj1OCr/vHnekPRkoO+kdMU+MU=\ngithub.com/stretchr/testify v1.11.1 h1:7s2iGBzp5EwR7/aIZr8ao5+dra3wiQyKjjFuvgVKu7U=\ngithub.com/stretchr/testify v1.11.1/go.mod h1:wZwfW3scLgRK+23gO65QZefKpKQRnfz6sD981Nm4B6U=\ngithub.com/twmb/franz-go v1.22.3 h1:RHe35s34pKefMLyL+ZYJ6mQVtfFZz4zHDHVkTyACur0=\ngithub.com/twmb/franz-go v1.22.3/go.mod h1:OhbFLkvp6GLcN5daC7I4Q2z0W/rFP16HG+gTbe9CDC4=\ngithub.com/twmb/franz-go/pkg/kmsg v1.15.1 h1:3sj7ekbH33t73nsBcHS0wtp/PyMIViHLNItZrE8V9zM=\ngithub.com/twmb/franz-go/pkg/kmsg v1.15.1/go.mod h1:sGkGxKexpRLBThFHJLjjywcyfkK09qB/g+X+wFWZQ/A=\ngolang.org/x/sync v0.22.0 h1:SZjpbeLmrCk4xhRSZFNZW5gFUeCeFgjekvI/+gfScek=\ngolang.org/x/sync v0.22.0/go.mod h1:9xrNwdLfx4jkKbNva9FpL6vEN7evnE43NNNJQ2LF3+0=\ngolang.org/x/text v0.41.0 h1:vz/seA0lnX87Othu2f/0L24RcgrXD9/YFTSuGjj3rH8=\ngolang.org/x/text v0.41.0/go.mod h1:jvf1O8ajNzZqhSrQBPbutR/EB83Cc0CFrezNQIwbb5M=\ngopkg.in/check.v1 v0.0.0-20161208181325-20d25e280405/go.mod h1:Co6ibVJAznAaIkqp8huTwlJQCZ016jof/cbN4VW5Yz0=\ngopkg.in/yaml.v3 v3.0.0-20200313102051-9f266ea9e77c/go.mod h1:K4uyk7z7BCEPqu6E+C64Yfv1cQ7kz7rIZviUmN+EgEM=\ngopkg.in/yaml.v3 v3.0.1 h1:fxVm/GzAzEWqLHuvctI91KS9hhNmmWOoWu0XTYJS7CA=\ngopkg.in/yaml.v3 v3.0.1/go.mod h1:K4uyk7z7BCEPqu6E+C64Yfv1cQ7kz7rIZviUmN+EgEM=\n", "internal/producer/generator.go": "package producer\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\t\"log/slog\"\n\t\"math/rand/v2\"\n\t\"time\"\n\n\t\"github.com/google/uuid\"\n)\n\nfunc (p *Producer) Generate(ctx context.Context, interval time.Duration) {\n\tticker := time.NewTicker(interval)\n\tdefer ticker.Stop()\n\n\tfor {\n\t\tselect {\n\t\tcase \u003c-ctx.Done():\n\t\t\treturn\n\t\tcase \u003c-ticker.C:\n\t\t\tfor _, event := range generateSession() {\n\t\t\t\tvalue, err := p.encode(event)\n\t\t\t\tif err == nil {\n\t\t\t\t\terr = p.publish(ctx, event, value)\n\t\t\t\t}\n\t\t\t\tif err != nil {\n\t\t\t\t\tslog.Error(\"cannot publish generated event\", \"event_id\", event.ID, \"error\", err)\n\t\t\t\t\tbreak\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n}\n\nfunc generateSession() []Event {\n\tdevices := []string{\"MOBILE\", \"DESKTOP\", \"TV\", \"TABLET\"}\n\tdevice := devices[rand.IntN(len(devices))]\n\tuser := fmt.Sprintf(\"demo-user-%d\", 1+rand.IntN(20))\n\tmovie := fmt.Sprintf(\"demo-movie-%d\", 1+rand.IntN(10))\n\tsession := uuid.NewString()\n\tfinished := int32(3600 + rand.IntN(3601))\n\tpaused := finished / 3\n\tzero := int32(0)\n\tstart := time.Now().UTC().Truncate(time.Millisecond).Add(-time.Duration(finished+120) * time.Second)\n\n\tcreateEvent := func(eventType, movieID string, seconds int32, progress *int32) Event {\n\t\treturn Event{\n\t\t\tID:              uuid.NewString(),\n\t\t\tUserID:          user,\n\t\t\tMovieID:         movieID,\n\t\t\tType:            eventType,\n\t\t\tTimestamp:       start.Add(time.Duration(seconds) * time.Second),\n\t\t\tDeviceType:      device,\n\t\t\tSessionID:       session,\n\t\t\tProgressSeconds: progress,\n\t\t}\n\t}\n\n\tevents := []Event{\n\t\tcreateEvent(\"SEARCHED\", \"\", 0, nil),\n\t\tcreateEvent(\"VIEW_STARTED\", movie, 10, &zero),\n\t\tcreateEvent(\"VIEW_PAUSED\", movie, paused+10, &paused),\n\t}\n\tif rand.IntN(4) == 0 {\n\t\treturn events\n\t}\n\tevents = append(events,\n\t\tcreateEvent(\"VIEW_RESUMED\", movie, paused+40, &paused),\n\t\tcreateEvent(\"VIEW_FINISHED\", movie, finished+40, &finished),\n\t)\n\tif rand.IntN(3) == 0 {\n\t\tevents = append(events, createEvent(\"LIKED\", movie, finished+50, nil))\n\t}\n\treturn events\n}\n", "internal/producer/http.go": "package producer\n\nimport (\n\t\"encoding/json\"\n\t\"io\"\n\t\"log/slog\"\n\t\"net/http\"\n\t\"time\"\n\n\t\"github.com/google/uuid\"\n)\n\nfunc (p *Producer) ServeEvent(w http.ResponseWriter, r *http.Request) {\n\tdecoder := json.NewDecoder(http.MaxBytesReader(w, r.Body, 64\u003c\u003c10))\n\tdecoder.DisallowUnknownFields()\n\tvar event Event\n\tif err := decoder.Decode(&event); err != nil {\n\t\twriteJSON(w, http.StatusBadRequest, map[string]string{\"error\": err.Error()})\n\t\treturn\n\t}\n\tif err := decoder.Decode(new(any)); err != io.EOF {\n\t\twriteJSON(w, http.StatusBadRequest, map[string]string{\"error\": \"expected one JSON event\"})\n\t\treturn\n\t}\n\n\tif event.ID == \"\" {\n\t\tevent.ID = uuid.NewString()\n\t}\n\tevent.Timestamp = event.Timestamp.UTC().Truncate(time.Millisecond)\n\tvalue, err := p.encode(event)\n\tif err != nil {\n\t\twriteJSON(w, http.StatusBadRequest, map[string]string{\"error\": err.Error()})\n\t\treturn\n\t}\n\tif err := p.publish(r.Context(), event, value); err != nil {\n\t\tslog.Error(\"cannot publish event\", \"event_id\", event.ID, \"error\", err)\n\t\twriteJSON(w, http.StatusServiceUnavailable, map[string]string{\"error\": \"cannot publish event\"})\n\t\treturn\n\t}\n\twriteJSON(w, http.StatusCreated, map[string]string{\"event_id\": event.ID})\n}\n\nfunc writeJSON(w http.ResponseWriter, status int, body map[string]string) {\n\tw.Header().Set(\"Content-Type\", \"application/json\")\n\tw.WriteHeader(status)\n\t_ = json.NewEncoder(w).Encode(body)\n}\n", "internal/producer/producer.go": "package producer\n\nimport (\n\t\"context\"\n\t\"encoding/binary\"\n\t\"encoding/json\"\n\t\"fmt\"\n\t\"log/slog\"\n\t\"net/http\"\n\t\"time\"\n\n\t\"github.com/linkedin/goavro/v2\"\n\t\"github.com/twmb/franz-go/pkg/kgo\"\n)\n\nconst topic = \"movie-events\"\n\ntype Producer struct {\n\tkafka    *kgo.Client\n\tcodec    *goavro.Codec\n\tschemaID uint32\n}\n\nfunc New(brokers []string, registryURL string) (*Producer, error) {\n\tclient := &http.Client{Timeout: 10 * time.Second}\n\tresp, err := client.Get(registryURL + \"/subjects/\" + topic + \"-value/versions/1\")\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"load Avro schema: %w\", err)\n\t}\n\tdefer resp.Body.Close()\n\tif resp.StatusCode != http.StatusOK {\n\t\treturn nil, fmt.Errorf(\"load Avro schema: registry returned %s\", resp.Status)\n\t}\n\tvar schema struct {\n\t\tID     uint32 `json:\"id\"`\n\t\tSchema string `json:\"schema\"`\n\t}\n\tif err := json.NewDecoder(resp.Body).Decode(&schema); err != nil {\n\t\treturn nil, fmt.Errorf(\"read Avro schema: %w\", err)\n\t}\n\tcodec, err := goavro.NewCodec(schema.Schema)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"parse Avro schema: %w\", err)\n\t}\n\tkafka, err := kgo.NewClient(\n\t\tkgo.SeedBrokers(brokers...),\n\t\tkgo.RecordPartitioner(kgo.StickyKeyPartitioner(nil)),\n\t\tkgo.RequiredAcks(kgo.AllISRAcks()),\n\t\tkgo.RecordRetries(5),\n\t\tkgo.RecordDeliveryTimeout(15*time.Second),\n\t\tkgo.RetryBackoffFn(func(attempt int) time.Duration {\n\t\t\treturn (250 * time.Millisecond) \u003c\u003c min(attempt, 4)\n\t\t}),\n\t)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"create Kafka client: %w\", err)\n\t}\n\treturn &Producer{kafka: kafka, codec: codec, schemaID: schema.ID}, nil\n}\n\nfunc (p *Producer) Close() {\n\tp.kafka.Close()\n}\n\nfunc (p *Producer) encode(event Event) ([]byte, error) {\n\tif err := event.validate(); err != nil {\n\t\treturn nil, err\n\t}\n\tprefix := make([]byte, 5)\n\tbinary.BigEndian.PutUint32(prefix[1:], p.schemaID)\n\treturn p.codec.BinaryFromNative(prefix, event.avroRecord())\n}\n\nfunc (p *Producer) publish(ctx context.Context, event Event, value []byte) error {\n\tctx, cancel := context.WithTimeout(ctx, 20*time.Second)\n\tdefer cancel()\n\terr := p.kafka.ProduceSync(ctx, &kgo.Record{\n\t\tTopic: topic,\n\t\tKey:   []byte(event.UserID),\n\t\tValue: value,\n\t}).FirstErr()\n\tif err != nil {\n\t\treturn err\n\t}\n\tslog.Info(\"event published\", \"event_id\", event.ID, \"event_type\", event.Type, \"timestamp\", event.Timestamp.UTC())\n\treturn nil\n}\n", "internal/producer/event.go": "package producer\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"time\"\n\n\t\"github.com/google/uuid\"\n\t\"github.com/linkedin/goavro/v2\"\n)\n\ntype Event struct {\n\tID              string    `json:\"event_id\"`\n\tUserID          string    `json:\"user_id\"`\n\tMovieID         string    `json:\"movie_id\"`\n\tType            string    `json:\"event_type\"`\n\tTimestamp       time.Time `json:\"timestamp\"`\n\tDeviceType      string    `json:\"device_type\"`\n\tSessionID       string    `json:\"session_id\"`\n\tProgressSeconds *int32    `json:\"progress_seconds\"`\n}\n\nfunc (event Event) validate() error {\n\tif err := uuid.Validate(event.ID); len(event.ID) != 36 || err != nil {\n\t\treturn fmt.Errorf(\"event_id must be a UUID\")\n\t}\n\tif strings.TrimSpace(event.UserID) == \"\" || strings.TrimSpace(event.SessionID) == \"\" {\n\t\treturn fmt.Errorf(\"user_id and session_id are required\")\n\t}\n\tif strings.TrimSpace(event.MovieID) == \"\" && (event.Type != \"SEARCHED\" || event.MovieID != \"\") {\n\t\treturn fmt.Errorf(\"movie_id is required except for searches without a specific movie\")\n\t}\n\tif event.Timestamp.IsZero() {\n\t\treturn fmt.Errorf(\"timestamp is required\")\n\t}\n\tswitch event.Type {\n\tcase \"VIEW_STARTED\", \"VIEW_PAUSED\", \"VIEW_RESUMED\", \"VIEW_FINISHED\":\n\t\tif event.ProgressSeconds == nil || *event.ProgressSeconds \u003c 0 {\n\t\t\treturn fmt.Errorf(\"progress_seconds must be a non-negative integer for view events\")\n\t\t}\n\tcase \"LIKED\", \"SEARCHED\":\n\t\tif event.ProgressSeconds != nil {\n\t\t\treturn fmt.Errorf(\"progress_seconds must be null for %s\", event.Type)\n\t\t}\n\t}\n\treturn nil\n}\n\nfunc (event Event) avroRecord() map[string]any {\n\tvar progress any\n\tif event.ProgressSeconds != nil {\n\t\tprogress = goavro.Union(\"int\", *event.ProgressSeconds)\n\t}\n\treturn map[string]any{\n\t\t\"event_id\":         event.ID,\n\t\t\"user_id\":          event.UserID,\n\t\t\"movie_id\":         event.MovieID,\n\t\t\"event_type\":       event.Type,\n\t\t\"timestamp\":        event.Timestamp,\n\t\t\"device_type\":      event.DeviceType,\n\t\t\"session_id\":       event.SessionID,\n\t\t\"progress_seconds\": progress,\n\t}\n}\n", "internal/aggregation/daily.sql": "INSERT INTO cinema.daily_metrics_stage (day, metric, movie_id, value, computed_at)\nWITH\n    {day:Date} AS report_day,\n    day_events AS (\n        SELECT DISTINCT event_id, user_id, movie_id, event_type, progress_seconds\n        FROM cinema.movie_events\n        WHERE toDate(timestamp) = report_day\n    ),\n    totals AS (\n        SELECT count() AS events,\n               uniqExact(user_id) AS users,\n               avgOrNullIf(progress_seconds, event_type = 'VIEW_FINISHED') AS avg_seconds,\n               countIf(event_type = 'VIEW_FINISHED') /\n                   nullIf(countIf(event_type = 'VIEW_STARTED'), 0) AS conversion\n        FROM day_events\n    ),\n    top_movies AS (\n        SELECT movie_id, count() AS views\n        FROM day_events\n        WHERE event_type = 'VIEW_STARTED'\n        GROUP BY movie_id\n        ORDER BY views DESC, movie_id\n        LIMIT 10\n    ),\n    first_views AS (\n        SELECT user_id,\n               minIf(toDate(timestamp), event_type = 'VIEW_STARTED') AS first_day,\n               countIf(toDate(timestamp) = report_day) > 0 AS returned\n        FROM cinema.movie_events\n        WHERE toDate(timestamp) \u003c= report_day\n        GROUP BY user_id\n        HAVING countIf(event_type = 'VIEW_STARTED') > 0\n    ),\n    retention AS (\n        SELECT countIf(first_day = report_day - 1 AND returned) /\n                   nullIf(countIf(first_day = report_day - 1), 0) AS d1,\n               countIf(first_day = report_day - 7 AND returned) /\n                   nullIf(countIf(first_day = report_day - 7), 0) AS d7\n        FROM first_views\n    )\nSELECT report_day, item.1, '', item.2, now64(3, 'UTC')\nFROM totals\nARRAY JOIN [('events_processed', toFloat64(events)), ('dau', toFloat64(users)),\n            ('avg_watch_seconds', avg_seconds), ('conversion', conversion)] AS item\nUNION ALL\nSELECT report_day, 'movie_views', movie_id, toFloat64(views), now64(3, 'UTC')\nFROM top_movies\nUNION ALL\nSELECT report_day, item.1, '', item.2, now64(3, 'UTC')\nFROM retention\nARRAY JOIN [('retention_d1', d1), ('retention_d7', d7)] AS item\n", "internal/aggregation/service.go": "package aggregation\n\nimport (\n\t\"bytes\"\n\t\"context\"\n\t_ \"embed\"\n\t\"encoding/json\"\n\t\"fmt\"\n\t\"io\"\n\t\"log/slog\"\n\t\"net/http\"\n\t\"net/url\"\n\t\"strings\"\n\t\"time\"\n\n\t\"github.com/jackc/pgx/v5/pgxpool\"\n)\n\n//go:embed daily.sql\nvar dailySQL string\n\ntype Service struct {\n\tDB            *pgxpool.Pool\n\tClickHouseURL string\n\tUser          string\n\tPassword      string\n}\n\ntype metricRow struct {\n\tMetric     string    `json:\"metric\"`\n\tMovieID    string    `json:\"movie_id\"`\n\tValue      *float64  `json:\"value\"`\n\tComputedAt time.Time `json:\"computed_at\"`\n}\n\nfunc (s *Service) query(ctx context.Context, day, sql string) ([]byte, error) {\n\tparams := url.Values{\"param_day\": {day}, \"date_time_output_format\": {\"iso\"}, \"wait_end_of_query\": {\"1\"}}\n\treq, err := http.NewRequestWithContext(ctx, http.MethodPost, s.ClickHouseURL+\"/?\"+params.Encode(), strings.NewReader(sql))\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\treq.SetBasicAuth(s.User, s.Password)\n\tresp, err := http.DefaultClient.Do(req)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tdefer resp.Body.Close()\n\tbody, err := io.ReadAll(resp.Body)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tif resp.StatusCode != http.StatusOK {\n\t\treturn nil, fmt.Errorf(\"ClickHouse %s: %s\", resp.Status, bytes.TrimSpace(body))\n\t}\n\treturn body, nil\n}\n\nfunc (s *Service) recalculate(ctx context.Context, day string) (int64, error) {\n\ttx, err := s.DB.Begin(ctx)\n\tif err != nil {\n\t\treturn 0, err\n\t}\n\tdefer tx.Rollback(ctx)\n\n\t// A manual run and the scheduler may request the same date at the same time.\n\tif _, err := tx.Exec(ctx, \"SELECT pg_advisory_xact_lock(($1::date - DATE '1970-01-01')::bigint)\", day); err != nil {\n\t\treturn 0, err\n\t}\n\tfor _, sql := range []string{\n\t\t\"ALTER TABLE cinema.daily_metrics_stage DROP PARTITION {day:Date}\",\n\t\tdailySQL,\n\t\t\"ALTER TABLE cinema.daily_metrics REPLACE PARTITION {day:Date} FROM cinema.daily_metrics_stage\",\n\t\t\"ALTER TABLE cinema.daily_metrics_stage DROP PARTITION {day:Date}\",\n\t} {\n\t\tif _, err := s.query(ctx, day, sql); err != nil {\n\t\t\treturn 0, err\n\t\t}\n\t}\n\tbody, err := s.query(ctx, day, \"SELECT metric, movie_id, value, computed_at FROM cinema.daily_metrics WHERE day = {day:Date} FORMAT JSON\")\n\tif err != nil {\n\t\treturn 0, err\n\t}\n\tvar result struct {\n\t\tData []metricRow `json:\"data\"`\n\t}\n\tif err := json.Unmarshal(body, &result); err != nil {\n\t\treturn 0, err\n\t}\n\n\t// Replace the whole day so movies that dropped out of the top also disappear.\n\tif _, err := tx.Exec(ctx, \"DELETE FROM daily_metrics WHERE day = $1::date\", day); err != nil {\n\t\treturn 0, err\n\t}\n\tvar processed int64\n\tfor _, row := range result.Data {\n\t\tif row.Metric == \"events_processed\" {\n\t\t\tprocessed = int64(*row.Value)\n\t\t}\n\t\t_, err := tx.Exec(ctx, \"INSERT INTO daily_metrics(day, metric, movie_id, value, computed_at) VALUES ($1::date,$2,$3,$4,$5)\", day, row.Metric, row.MovieID, row.Value, row.ComputedAt)\n\t\tif err != nil {\n\t\t\treturn processed, err\n\t\t}\n\t}\n\treturn processed, tx.Commit(ctx)\n}\n\nfunc (s *Service) Run(ctx context.Context, date time.Time) (int64, error) {\n\tday := date.Format(time.DateOnly)\n\tstart := time.Now()\n\tctx, cancel := context.WithTimeout(ctx, 2*time.Minute)\n\tdefer cancel()\n\tslog.Info(\"aggregation started\", \"date\", day)\n\tvar processed int64\n\tvar err error\n\tfor attempt := 1; attempt \u003c= 3; attempt++ {\n\t\tprocessed, err = s.recalculate(ctx, day)\n\t\tif err == nil {\n\t\t\tbreak\n\t\t}\n\t\tslog.Error(\"aggregation attempt failed\", \"date\", day, \"attempt\", attempt, \"error\", err)\n\t\tif attempt \u003c 3 && ctx.Err() == nil {\n\t\t\tselect {\n\t\t\tcase \u003c-ctx.Done():\n\t\t\tcase \u003c-time.After(time.Duration(attempt) * time.Second):\n\t\t\t}\n\t\t}\n\t\tif ctx.Err() != nil {\n\t\t\tbreak\n\t\t}\n\t}\n\tslog.Info(\"aggregation finished\", \"date\", day, \"events\", processed, \"duration\", time.Since(start), \"success\", err == nil)\n\treturn processed, err\n}\n", "integration/aggregation_test.sh": "#!/bin/sh\nset -eu\ncd \"$(dirname \"$0\")/..\"\n\n# A separate project gives this test empty databases and its own HTTP port.\ntmp=$(mktemp -d)\nproject=\"cinema-metrics-test-$(date +%s)-$$\"\ncat > \"$tmp/compose.yml\" \u003c\u003c'YAML'\nservices:\n  clickhouse:\n    ports: !reset []\n  aggregation:\n    ports: !override [\"127.0.0.1::8082\"]\nYAML\ncompose() { docker compose -p \"$project\" -f docker-compose.yml -f \"$tmp/compose.yml\" \"$@\"; }\ncleanup() { compose down -v --rmi local; rm -f \"$tmp/compose.yml\"; rmdir \"$tmp\"; }\ntrap cleanup EXIT\ncompose up -d --build aggregation\nendpoint=\"http://$(compose port aggregation 8082)/recalculate\"\nch() { compose exec -T clickhouse clickhouse-client --user cinema --password cinema \"$@\"; }\npg() { compose exec -T postgres psql -XAt -F ' ' -U cinema -d cinema -c \"$1\"; }\n\nch --query \"INSERT INTO cinema.movie_events\n  SELECT generateUUIDv4(), u, m, t, dt, 'TV', u, progress\n  FROM values('u String, m String, t String, dt DateTime, progress Nullable(Int32)',\n    ('a','X','VIEW_STARTED','2025-01-09 12:00:00',0),\n    ('b','X','VIEW_STARTED','2025-01-09 12:00:00',0),\n    ('c','Y','VIEW_STARTED','2025-01-03 12:00:00',0),\n    ('d','Y','VIEW_STARTED','2025-01-03 12:00:00',0),\n    ('a','X','VIEW_STARTED','2025-01-10 12:00:00',0),\n    ('a','X','VIEW_FINISHED','2025-01-10 12:02:00',120),\n    ('c','Y','VIEW_STARTED','2025-01-10 13:00:00',0),\n    ('c','Y','VIEW_FINISHED','2025-01-10 13:04:00',240),\n    ('c','Y','VIEW_STARTED','2025-01-10 14:00:00',0),\n    ('e','X','LIKED','2025-01-10 15:00:00',NULL))\"\n\nexpected='avg_watch_seconds - 180\nconversion - 0.6667\ndau - 3\nevents_processed - 6\nmovie_views X 1\nmovie_views Y 2\nretention_d1 - 0.5\nretention_d7 - 0.5'\nfor run in 1 2; do\n    curl -fsS --retry-connrefused --retry 3 -X POST \"$endpoint?date=2025-01-10\"\n    actual_pg=$(pg \"SELECT metric, coalesce(nullif(movie_id,''),'-'), round(value::numeric,4)::float8 FROM daily_metrics WHERE day='2025-01-10' ORDER BY metric,movie_id\")\n    actual_ch=$(ch --query \"SELECT metric, if(empty(movie_id),'-',movie_id), round(value,4) FROM cinema.daily_metrics WHERE day='2025-01-10' ORDER BY metric,movie_id\" | tr '\\t' ' ')\n    if [ \"$actual_pg\" != \"$expected\" ] || [ \"$actual_ch\" != \"$expected\" ]; then\n        printf 'Expected:\\n%s\\nPostgreSQL:\\n%s\\nClickHouse:\\n%s\\n' \"$expected\" \"$actual_pg\" \"$actual_ch\"\n        exit 1\n    fi\ndone\necho 'Daily metrics and repeated recalculation passed.'\n", "integration/pipeline_test.go": "//go:build integration\n\npackage integration\n\nimport (\n\t\"bytes\"\n\t\"encoding/json\"\n\t\"errors\"\n\t\"io\"\n\t\"net/http\"\n\t\"net/url\"\n\t\"os\"\n\t\"reflect\"\n\t\"strings\"\n\t\"testing\"\n\t\"time\"\n\n\t\"github.com/google/uuid\"\n)\n\ntype event struct {\n\tID              string    `json:\"event_id\"`\n\tUserID          string    `json:\"user_id\"`\n\tMovieID         string    `json:\"movie_id\"`\n\tType            string    `json:\"event_type\"`\n\tTimestamp       time.Time `json:\"timestamp\"`\n\tDeviceType      string    `json:\"device_type\"`\n\tSessionID       string    `json:\"session_id\"`\n\tProgressSeconds *int32    `json:\"progress_seconds\"`\n}\n\nfunc TestPipeline(t *testing.T) {\n\tproducerURL := os.Getenv(\"PRODUCER_URL\")\n\tclickhouseURL := os.Getenv(\"CLICKHOUSE_URL\")\n\tif producerURL == \"\" || clickhouseURL == \"\" {\n\t\tt.Fatal(\"PRODUCER_URL and CLICKHOUSE_URL are required\")\n\t}\n\tclient := &http.Client{Timeout: 25 * time.Second}\n\tendpoint := producerURL + \"/events\"\n\twaitForProducer(t, client, endpoint)\n\n\trunID := uuid.NewString()\n\tprogress := int32(120)\n\tfor _, input := range []event{\n\t\t{Type: \"VIEW_PAUSED\", MovieID: \"test-movie\", ProgressSeconds: &progress},\n\t\t{Type: \"SEARCHED\"},\n\t} {\n\t\tt.Run(input.Type, func(t *testing.T) {\n\t\t\tinput.ID = uuid.NewString()\n\t\t\tinput.UserID = \"test-user-\" + runID\n\t\t\tinput.SessionID = \"test-session-\" + runID\n\t\t\tinput.DeviceType = \"TV\"\n\t\t\tinput.Timestamp = time.Now().UTC().Truncate(time.Millisecond)\n\n\t\t\tpublish(t, client, endpoint, input)\n\t\t\tgot := waitForEvent(t, client, clickhouseURL, input)\n\t\t\tif !reflect.DeepEqual(got, input) {\n\t\t\t\tgotJSON, _ := json.Marshal(got)\n\t\t\t\twantJSON, _ := json.Marshal(input)\n\t\t\t\tt.Fatalf(\"got %s\\nwant %s\", gotJSON, wantJSON)\n\t\t\t}\n\t\t})\n\t}\n}\n\nfunc waitForProducer(t *testing.T, client *http.Client, endpoint string) {\n\tt.Helper()\n\tfor deadline := time.Now().Add(15 * time.Second); time.Now().Before(deadline); time.Sleep(200 * time.Millisecond) {\n\t\tresp, err := client.Get(endpoint)\n\t\tif err == nil {\n\t\t\tresp.Body.Close()\n\t\t\tif resp.StatusCode == http.StatusMethodNotAllowed {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n\tt.Fatal(\"producer did not start listening on \" + endpoint)\n}\n\nfunc publish(t *testing.T, client *http.Client, endpoint string, input event) {\n\tt.Helper()\n\tbody, err := json.Marshal(input)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tresp, err := client.Post(endpoint, \"application/json\", bytes.NewReader(body))\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdefer resp.Body.Close()\n\tif resp.StatusCode != http.StatusCreated {\n\t\tdetail, _ := io.ReadAll(resp.Body)\n\t\tt.Fatalf(\"producer returned %s: %s\", resp.Status, detail)\n\t}\n\tvar result struct {\n\t\tID string `json:\"event_id\"`\n\t}\n\tif err := json.NewDecoder(resp.Body).Decode(&result); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif result.ID != input.ID {\n\t\tt.Fatalf(\"producer returned event ID %q, want %q\", result.ID, input.ID)\n\t}\n}\n\nfunc waitForEvent(t *testing.T, client *http.Client, endpoint string, input event) event {\n\tt.Helper()\n\tquery := `SELECT event_id, user_id, movie_id, event_type, timestamp, device_type, session_id, progress_seconds\nFROM cinema.movie_events\nWHERE toDate(timestamp) = {day:Date} AND event_id = {id:UUID}\nLIMIT 1 FORMAT JSONEachRow`\n\tparams := url.Values{\n\t\t\"param_day\":               {input.Timestamp.Format(time.DateOnly)},\n\t\t\"param_id\":                {input.ID},\n\t\t\"date_time_output_format\": {\"iso\"},\n\t}\n\tfor deadline := time.Now().Add(20 * time.Second); time.Now().Before(deadline); time.Sleep(250 * time.Millisecond) {\n\t\treq, err := http.NewRequest(http.MethodPost, endpoint+\"/?\"+params.Encode(), strings.NewReader(query))\n\t\tif err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\treq.SetBasicAuth(os.Getenv(\"CLICKHOUSE_USER\"), os.Getenv(\"CLICKHOUSE_PASSWORD\"))\n\t\tresp, err := client.Do(req)\n\t\tif err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tif resp.StatusCode != http.StatusOK {\n\t\t\tdetail, _ := io.ReadAll(resp.Body)\n\t\t\tresp.Body.Close()\n\t\t\tt.Fatalf(\"ClickHouse returned %s: %s\", resp.Status, detail)\n\t\t}\n\t\tvar got event\n\t\terr = json.NewDecoder(resp.Body).Decode(&got)\n\t\tresp.Body.Close()\n\t\tif err == nil {\n\t\t\treturn got\n\t\t}\n\t\tif !errors.Is(err, io.EOF) {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tt.Fatalf(\"event %s did not reach ClickHouse\", input.ID)\n\treturn event{}\n}\n", "Dockerfile": "FROM golang:1.27 AS build\nWORKDIR /src\n\nCOPY go.mod go.sum ./\n\nFROM build AS schema-init-build\nCOPY cmd/schema-init ./cmd/schema-init\nRUN CGO_ENABLED=0 go build -o /out/schema-init ./cmd/schema-init\n\nFROM scratch AS schema-init\nWORKDIR /app\nCOPY --from=schema-init-build /out/schema-init /schema-init\nCOPY schemas/movie-event.avsc ./schemas/movie-event.avsc\nENTRYPOINT [\"/schema-init\"]\n\nFROM build AS producer-build\nRUN go mod download\nCOPY cmd/producer ./cmd/producer\nCOPY internal/producer ./internal/producer\nRUN CGO_ENABLED=0 go build -o /out/producer ./cmd/producer\n\nFROM scratch AS producer\nCOPY --from=producer-build /out/producer /producer\nEXPOSE 8080\nENTRYPOINT [\"/producer\"]\n\nFROM build AS pipeline-test-build\nCOPY integration ./integration\nRUN CGO_ENABLED=0 go test -tags=integration -c -o /out/pipeline-test ./integration\n\nFROM scratch AS pipeline-test\nCOPY --from=pipeline-test-build /out/pipeline-test /pipeline-test\nENTRYPOINT [\"/pipeline-test\", \"-test.v\", \"-test.timeout=90s\"]\n\nFROM build AS aggregation-build\nRUN go mod download\nCOPY cmd/aggregation ./cmd/aggregation\nCOPY internal/aggregation ./internal/aggregation\nRUN CGO_ENABLED=0 go build -o /out/aggregation ./cmd/aggregation\n\nFROM scratch AS aggregation\nCOPY --from=aggregation-build /out/aggregation /aggregation\nEXPOSE 8082\nENTRYPOINT [\"/aggregation\"]\n", "go.mod": "module onlinecinema\n\ngo 1.27.1\n\nrequire (\n\tgithub.com/google/uuid v1.6.0\n\tgithub.com/jackc/pgx/v5 v5.12.0\n\tgithub.com/linkedin/goavro/v2 v2.15.0\n\tgithub.com/twmb/franz-go v1.22.3\n)\n\nrequire (\n\tgithub.com/golang/snappy v0.0.1 // indirect\n\tgithub.com/jackc/pgpassfile v1.0.0 // indirect\n\tgithub.com/jackc/pgservicefile v0.0.0-20240606120523-5a60cdf6a761 // indirect\n\tgithub.com/jackc/puddle/v2 v2.2.3 // indirect\n\tgithub.com/klauspost/compress v1.20.3 // indirect\n\tgithub.com/pierrec/lz4/v4 v4.1.33 // indirect\n\tgithub.com/twmb/franz-go/pkg/kmsg v1.15.1 // indirect\n\tgolang.org/x/sync v0.22.0 // indirect\n\tgolang.org/x/text v0.41.0 // indirect\n)\n", "clickhouse/001_movie_events.sql": "CREATE DATABASE IF NOT EXISTS cinema;\n\nCREATE TABLE IF NOT EXISTS cinema.movie_events\n(\n    event_id UUID,\n    user_id String,\n    movie_id String,\n    event_type Enum8(\n        'VIEW_STARTED' = 1, 'VIEW_FINISHED' = 2, 'VIEW_PAUSED' = 3,\n        'VIEW_RESUMED' = 4, 'LIKED' = 5, 'SEARCHED' = 6\n    ),\n    timestamp DateTime64(3, 'UTC'),\n    device_type Enum8('MOBILE' = 1, 'DESKTOP' = 2, 'TV' = 3, 'TABLET' = 4),\n    session_id String,\n    progress_seconds Nullable(Int32)\n)\nENGINE = MergeTree\nPARTITION BY toYYYYMM(timestamp)\nORDER BY (toDate(timestamp), event_type, user_id, timestamp, event_id);\n\nCREATE TABLE IF NOT EXISTS cinema.movie_events_kafka AS cinema.movie_events\nENGINE = Kafka\nSETTINGS kafka_broker_list = 'kafka:29092',\n         kafka_topic_list = 'movie-events',\n         kafka_group_name = 'clickhouse-movie-events',\n         kafka_format = 'AvroConfluent',\n         format_avro_schema_registry_url = 'http://schema-registry:8081',\n         kafka_flush_interval_ms = 1000;\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS cinema.movie_events_ingest\nTO cinema.movie_events AS\nSELECT event_id, user_id, movie_id, event_type, timestamp, device_type, session_id, progress_seconds\nFROM cinema.movie_events_kafka;\n", "clickhouse/002_daily_metrics.sql": "CREATE TABLE IF NOT EXISTS cinema.daily_metrics\n(\n    day Date,\n    metric String,\n    movie_id String,\n    value Nullable(Float64),\n    computed_at DateTime64(3, 'UTC')\n)\nENGINE = MergeTree\nPARTITION BY day\nORDER BY (metric, movie_id);\n\n-- Build one complete day here before replacing the published partition.\nCREATE TABLE IF NOT EXISTS cinema.daily_metrics_stage AS cinema.daily_metrics;\n", "cmd/schema-init/main.go": "package main\n\nimport (\n\t\"bytes\"\n\t\"encoding/json\"\n\t\"fmt\"\n\t\"io\"\n\t\"log\"\n\t\"net/http\"\n\t\"os\"\n\t\"time\"\n)\n\nconst subject = \"movie-events-value\"\n\nfunc main() {\n\tregistryURL := os.Getenv(\"SCHEMA_REGISTRY_URL\")\n\tif registryURL == \"\" {\n\t\tlog.Fatal(\"SCHEMA_REGISTRY_URL is not set\")\n\t}\n\tschema, err := os.ReadFile(\"schemas/movie-event.avsc\")\n\tif err != nil {\n\t\tlog.Fatal(\"cannot read Avro schema: \", err)\n\t}\n\tschemaID, err := registerSchema(registryURL, string(schema))\n\tif err != nil {\n\t\tlog.Fatal(\"cannot register Avro schema: \", err)\n\t}\n\tlog.Printf(\"registered %s with schema ID %d\", subject, schemaID)\n}\n\nfunc registerSchema(registryURL, schema string) (int, error) {\n\tbody, err := json.Marshal(map[string]string{\"schemaType\": \"AVRO\", \"schema\": schema})\n\tif err != nil {\n\t\treturn 0, err\n\t}\n\tclient := &http.Client{Timeout: 20 * time.Second}\n\turl := registryURL + \"/subjects/\" + subject + \"/versions\"\n\tresp, err := client.Post(url, \"application/vnd.schemaregistry.v1+json\", bytes.NewReader(body))\n\tif err != nil {\n\t\treturn 0, err\n\t}\n\tdefer resp.Body.Close()\n\tif resp.StatusCode != http.StatusOK {\n\t\tdetail, err := io.ReadAll(io.LimitReader(resp.Body, 4096))\n\t\tif err != nil {\n\t\t\treturn 0, fmt.Errorf(\"registry returned %s: %w\", resp.Status, err)\n\t\t}\n\t\treturn 0, fmt.Errorf(\"registry returned %s: %s\", resp.Status, detail)\n\t}\n\tvar result struct {\n\t\tID int `json:\"id\"`\n\t}\n\tif err := json.NewDecoder(resp.Body).Decode(&result); err != nil {\n\t\treturn 0, err\n\t}\n\treturn result.ID, nil\n}\n", "cmd/producer/main.go": "package main\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"log\"\n\t\"log/slog\"\n\t\"net/http\"\n\t\"os\"\n\t\"os/signal\"\n\t\"strings\"\n\t\"syscall\"\n\t\"time\"\n\n\t\"onlinecinema/internal/producer\"\n)\n\nfunc main() {\n\tslog.SetDefault(slog.New(slog.NewJSONHandler(os.Stdout, nil)))\n\tbrokers := os.Getenv(\"KAFKA_BROKERS\")\n\tregistryURL := os.Getenv(\"SCHEMA_REGISTRY_URL\")\n\tif brokers == \"\" || registryURL == \"\" {\n\t\tlog.Fatal(\"KAFKA_BROKERS and SCHEMA_REGISTRY_URL are required\")\n\t}\n\tp, err := producer.New(strings.Split(brokers, \",\"), registryURL)\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tdefer p.Close()\n\tctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)\n\tdefer stop()\n\tif os.Getenv(\"GENERATE_EVENTS\") == \"true\" {\n\t\tinterval := 5 * time.Second\n\t\tif value := os.Getenv(\"GENERATOR_INTERVAL\"); value != \"\" {\n\t\t\tinterval, err = time.ParseDuration(value)\n\t\t\tif err != nil || interval \u003c= 0 {\n\t\t\t\tlog.Fatal(\"GENERATOR_INTERVAL must be a positive duration\")\n\t\t\t}\n\t\t}\n\t\tgo p.Generate(ctx, interval)\n\t}\n\tmux := http.NewServeMux()\n\tmux.HandleFunc(\"POST /events\", p.ServeEvent)\n\tserver := &http.Server{Addr: \":8080\", Handler: mux, ReadTimeout: 5 * time.Second, WriteTimeout: 25 * time.Second}\n\tserverErrors := make(chan error, 1)\n\tgo func() {\n\t\tserverErrors \u003c- server.ListenAndServe()\n\t}()\n\tslog.Info(\"producer started\", \"addr\", server.Addr)\n\n\tselect {\n\tcase err := \u003c-serverErrors:\n\t\tif !errors.Is(err, http.ErrServerClosed) {\n\t\t\tlog.Fatal(err)\n\t\t}\n\tcase \u003c-ctx.Done():\n\t\tshutdownCtx, cancel := context.WithTimeout(context.Background(), 5*time.Second)\n\t\tdefer cancel()\n\t\tif err := server.Shutdown(shutdownCtx); err != nil {\n\t\t\tslog.Error(\"cannot shut down HTTP server\", \"error\", err)\n\t\t}\n\t}\n}\n", "cmd/aggregation/main.go": "package main\n\nimport (\n\t\"context\"\n\t\"encoding/json\"\n\t\"log\"\n\t\"log/slog\"\n\t\"net/http\"\n\t\"os\"\n\t\"os/signal\"\n\t\"syscall\"\n\t\"time\"\n\n\t\"github.com/jackc/pgx/v5/pgxpool\"\n\n\t\"onlinecinema/internal/aggregation\"\n)\n\nfunc main() {\n\tctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)\n\tdefer stop()\n\tdb, err := pgxpool.New(ctx, os.Getenv(\"DATABASE_URL\"))\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tdefer db.Close()\n\tservice := aggregation.Service{DB: db, ClickHouseURL: os.Getenv(\"CLICKHOUSE_URL\"), User: os.Getenv(\"CLICKHOUSE_USER\"), Password: os.Getenv(\"CLICKHOUSE_PASSWORD\")}\n\tinterval, err := time.ParseDuration(os.Getenv(\"AGGREGATION_INTERVAL\"))\n\tif err != nil || interval \u003c= 0 {\n\t\tlog.Fatal(\"AGGREGATION_INTERVAL must be a positive duration\")\n\t}\n\tgo func() {\n\t\tticker := time.NewTicker(interval)\n\t\tdefer ticker.Stop()\n\t\tfor {\n\t\t\ttoday := time.Now().UTC()\n\t\t\tfor _, day := range []time.Time{today.AddDate(0, 0, -1), today} {\n\t\t\t\tif ctx.Err() != nil {\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t\tservice.Run(ctx, day)\n\t\t\t}\n\t\t\tselect {\n\t\t\tcase \u003c-ctx.Done():\n\t\t\t\treturn\n\t\t\tcase \u003c-ticker.C:\n\t\t\t}\n\t\t}\n\t}()\n\n\tmux := http.NewServeMux()\n\tmux.HandleFunc(\"POST /recalculate\", func(w http.ResponseWriter, r *http.Request) {\n\t\tday, err := time.Parse(time.DateOnly, r.URL.Query().Get(\"date\"))\n\t\tif err != nil {\n\t\t\thttp.Error(w, \"date must be YYYY-MM-DD\", http.StatusBadRequest)\n\t\t\treturn\n\t\t}\n\t\t// ClickHouse Date stores an unsigned 16-bit count of days since 1970.\n\t\tif day.Unix() \u003c 0 || day.Unix()/86400 > 65535 {\n\t\t\thttp.Error(w, \"date is outside the ClickHouse Date range\", http.StatusBadRequest)\n\t\t\treturn\n\t\t}\n\t\tprocessed, err := service.Run(r.Context(), day)\n\t\tif err != nil {\n\t\t\thttp.Error(w, \"aggregation failed\", http.StatusServiceUnavailable)\n\t\t\treturn\n\t\t}\n\t\tw.Header().Set(\"Content-Type\", \"application/json\")\n\t\tjson.NewEncoder(w).Encode(map[string]any{\"date\": day.Format(time.DateOnly), \"events_processed\": processed})\n\t})\n\tserver := &http.Server{Addr: \":8082\", Handler: mux, ReadHeaderTimeout: 5 * time.Second}\n\tgo func() {\n\t\t\u003c-ctx.Done()\n\t\tserver.Close()\n\t}()\n\tslog.Info(\"aggregation service started\", \"interval\", interval.String())\n\tif err := server.ListenAndServe(); err != http.ErrServerClosed {\n\t\tlog.Fatal(err)\n\t}\n}\n"}</script>

let pos=0;const D=document;
function elem(tag,txt,cls){const n=D.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}
const chapters=el('chapter'), files=el('file');
steps.forEach((s,i)=>chapters.add(new Option((i+1)+' · '+s.name,String(i))));
function code(){
 const [path,a,b,note]=steps[pos].files[files.selectedIndex],lines=sources[path].trimEnd().split('\n');
 el('explain').textContent=note;el('lines').textContent='Строки '+a+'–'+Math.min(b,lines.length);
 el('code').textContent=lines.slice(a-1,b).join('\n');el('entire').textContent=sources[path];el('full').open=false;
}
function draw(){
 const s=steps[pos];chapters.value=String(pos);el('back').disabled=pos===0;el('next').disabled=pos===steps.length-1;
 el('question').textContent=s.question;el('detail').textContent=s.detail;
 const flow=el('flow');flow.replaceChildren();
 s.flow.forEach(([shape,title,sub],i)=>{
  if(i){const arrow=elem('div',undefined,'arr');arrow.setAttribute('aria-hidden','true');arrow.append(elem('span','→'));flow.append(arrow)}
  const fig=elem('figure');fig.innerHTML='<svg class="plate" viewBox="0 0 130 66" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">'+drawings[shape]+'</svg>';
  fig.querySelectorAll('.mark').forEach(p=>{p.setAttribute('stroke','var(--viz-series-1)');p.setAttribute('stroke-width','3')});
  const cap=elem('figcaption');cap.append(elem('strong',title),elem('span',sub,'text-small'));fig.append(cap);flow.append(fig);
 });
 const table=elem('table',undefined,'table table-sm');
 const head=table.createTHead().insertRow(),body=table.createTBody();s.rows[0].forEach(t=>head.append(elem('th',t)));
 s.rows.slice(1).forEach(values=>{const row=body.insertRow();values.forEach(v=>row.append(elem('td',v)))});
 el('sample').replaceChildren(table);files.replaceChildren();s.files.forEach(([p])=>files.add(new Option(p,p)));code();
}
function save(){window.openai?.setWidgetState?.({modelContent:{chapter:steps[pos].name,file:files.value},privateContent:{pos,open:el('source').open}})?.catch(()=>{})}
function move(i){pos=i;draw();save()}
function restore(st){const n=st?.privateContent?.pos;if(!Number.isInteger(n)||!steps[n])return;pos=n;draw();const f=st.modelContent?.file;if(steps[n].files.some(v=>v[0]===f)){files.value=f;code()}el('source').open=!!st.privateContent.open}
el('back').onclick=()=>move(pos-1);el('next').onclick=()=>move(pos+1);chapters.onchange=()=>move(Number(chapters.value));files.onchange=()=>{code();save()};
draw();restore(window.openai?.widgetState);
window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
})();
</script>
